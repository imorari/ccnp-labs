    !
    router ospf 1
     router-id 5.5.5.5
     auto-cost reference-bandwidth 10000
     area 2 virtual-link 2.2.2.2
     area 3 nssa
     network 5.5.5.5 0.0.0.0 area 2
     network 172.16.5.1 0.0.0.0 area 2
     network 10.2.25.2 0.0.0.0 area 2
     network 10.3.56.1 0.0.0.0 area 3
     passive-interface Loopback0
     passive-interface Loopback10
