    end
  interfaces:
  - id: i0
    slot: 0
    label: GigabitEthernet0/0
    type: physical
  - id: i1
    slot: 1
    label: GigabitEthernet0/1
    type: physical
- id: n5
  label: R6
  node_definition: iosv
  x: -440
  y: 200
  tags: []
  configuration: |
    hostname R6
    no ip domain lookup
    service timestamps debug datetime msec
    service timestamps log datetime msec
    logging buffered 32768
    !
    line con 0
     exec-timeout 0 0
     logging synchronous
    !
    interface Loopback0
     ip address 6.6.6.6 255.255.255.255
     no shutdown
    !
    interface Loopback10
     description Simulated user LAN
     ip address 172.16.6.1 255.255.255.0
     ip ospf network point-to-point
     no shutdown
    !
    interface Loopback20
     description Simulated external (redistributed) network
     ip address 172.31.6.1 255.255.255.0
     no shutdown
    !
    interface GigabitEthernet0/0
     description To R5 - Area 3 NSSA
     ip address 10.3.56.2 255.255.255.252
     ip ospf network point-to-point
     ip mtu 1400
     no shutdown
    !
    router ospf 1
     router-id 6.6.6.6
     auto-cost reference-bandwidth 10000
     area 3 nssa
     redistribute connected route-map RM-LO20
     network 6.6.6.6 0.0.0.0 area 3
     network 172.16.6.0 0.0.0.0 area 3
     network 10.3.56.2 0.0.0.0 area 3
     passive-interface Loopback0
     passive-interface Loopback10
    !
    route-map RM-LO20 permit 10
     match interface Loopback20
    !
    end
