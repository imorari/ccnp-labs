lab:
  title: OSPF Troubleshooting - CCNP (9 faults)
  description: 'Multi-area OSPF troubleshooting lab: stub, NSSA, virtual link, MD5 auth, redistribution.'
  notes: |
    # OSPF Troubleshooting (CCNP) - 9 faults injected

    Start all nodes and wait ~3-5 minutes for IOSv to finish booting.
    Console into any router; no credentials are required.

    Design intent: single OSPF process 1 across all routers:
    Area 0 (R1/R2/R3 via SW1, MD5 auth), Area 1 totally stubby (R1/R4),
    Area 2 transit (R2/R5), Area 3 NSSA (R5/R6) joined to the backbone by a
    virtual link R2<->R5, and R3 as the Internet-edge ASBR (default route).

    Goal: every router can ping 8.8.8.8 (source from a 172.16.x.1 loopback or a
    10.x interface), and every 172.16.x.0/24 and 172.31.6.0/24 is reachable
    from everywhere it should be. See the lab guide for tickets.
  version: 0.2.0
nodes:
- id: n0
  label: R4
  node_definition: iosv
  x: -200
  y: -200
  tags: []
  configuration: |
    hostname R4
    no ip domain lookup
    service timestamps debug datetime msec
    service timestamps log datetime msec
    logging buffered 32768
    !
    line con 0
     exec-timeout 0 0
     logging synchronous
    !
    interface Loopback0
     ip address 4.4.4.4 255.255.255.255
     no shutdown
    !
    interface Loopback10
     description Simulated user LAN
     ip address 172.16.4.1 255.255.255.0
     ip ospf network point-to-point
     no shutdown
    !
    interface GigabitEthernet0/0
     description To R1 - Area 1
     ip address 10.1.14.2 255.255.255.252
     ip ospf network point-to-point
     no shutdown
    !
    router ospf 1
     router-id 4.4.4.4
     auto-cost reference-bandwidth 10000
     network 4.4.4.4 0.0.0.0 area 1
     network 172.16.4.1 0.0.0.0 area 1
     network 10.1.14.2 0.0.0.0 area 1
     passive-interface Loopback0
     passive-interface Loopback10
    !
    end
  interfaces:
  - id: i0
    slot: 0
    label: GigabitEthernet0/0
    type: physical
- id: n1
  label: R1
  node_definition: iosv
  x: 40
  y: -200
  tags: []
  configuration: |
    hostname R1
    no ip domain lookup
    service timestamps debug datetime msec
    service timestamps log datetime msec
    logging buffered 32768
    !
    line con 0
     exec-timeout 0 0
     logging synchronous
    !
    interface Loopback0
     ip address 1.1.1.1 255.255.255.255
     no shutdown
    !
    interface GigabitEthernet0/0
     description Area 0 segment via SW1
     ip address 10.0.0.1 255.255.255.0
     ip ospf authentication message-digest
     ip ospf message-digest-key 1 md5 CCNP-LAB
     no shutdown
    !
    interface GigabitEthernet0/1
     description To R4 - Area 1
     ip address 10.1.14.1 255.255.255.252
     ip ospf network point-to-point
     no shutdown
    !
    router ospf 1
     router-id 1.1.1.1
     auto-cost reference-bandwidth 10000
     area 1 stub no-summary
     network 1.1.1.1 0.0.0.0 area 0
     network 10.0.0.1 0.0.0.0 area 0
     network 10.1.14.1 0.0.0.0 area 1
     passive-interface Loopback0
    !
    end
  interfaces:
  - id: i0
    slot: 0
    label: GigabitEthernet0/0
    type: physical
  - id: i1
    slot: 1
    label: GigabitEthernet0/1
    type: physical
- id: n2
  label: SW1
