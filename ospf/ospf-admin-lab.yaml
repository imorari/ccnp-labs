lab:
  title: OSPF Administration - Practice
  description: 'OSPF administration practice: cost/bandwidth, summarization, route and LSA filtering, redistribution control, key-chain authentication.'
  notes: |
    # OSPF Administration Lab

    Start state: addressing, basic OSPF (interface-level "ip ospf 1 area N") and RIPv2 already work.
    Everything else is yours to configure. Requirements are also drawn on the topology canvas.

    Areas: 0 = R1 R2 R3 R4 ring | 1 = R2(ABR) R5 R8 | 2 = R4(ABR) R6 | RIPv2 = R3(ASBR) - R7

    ## 1  HYGIENE
    1.1 passive-interface default on every OSPF router; un-passive only the routed OSPF links (R3-R7 is RIP, not OSPF)
    1.2 All routed OSPF links = point-to-point (no DR/BDR), both ends
    1.3 Area 2 totally stubby (ABR R4, internal router R6)

    ## 2  PATH MANIPULATION
    2.1 Reference bandwidth 10000 (Mbps) on all OSPF routers
    2.2 R2-R5 is a 100 Mbps circuit, R5-R8 a 10 Mbps circuit. Use the `bandwidth` command (NOT ip ospf cost) so the OSPF costs become 100 and 1000
    2.3 R3-R4 is a backup link: cost 100 on both ends. R1 <-> R3 traffic must use R2 only; the ring must still fail over to R4 if R2-R3 goes down

    ## 3  SUMMARIZATION
    3.1 R2: advertise 172.16.48.0/22 into area 0 instead of the four /24s behind R5 (172.16.48.0 - 172.16.51.0)

    ## 4  REDISTRIBUTION FILTERING (R3: RIP -> OSPF)
    4.1 Only 192.168.10.0/24 and 192.168.20.0/24 may enter OSPF. 192.168.30.0/24 and 192.168.40.0/24 stay in RIP only
    4.2 192.168.10.0/24: Type 1 (E1), seed metric 50, tag 110. 192.168.20.0/24: Type 2 (E2), seed metric 20, tag 120

    ## 5  ROUTE FILTERING (routing table only, LSDB untouched)
    5.1 R1: do not install 192.168.20.0/24 (prefix-list). The Type 5 LSA must remain in R1's database
    5.2 R5: do not install external routes carrying tag 110 (route-map). All other routers still install them

    ## 6  LSA FILTERING
    6.1 R2: area 1 must not receive 172.16.60.0/24 (Type 3 LSA)
    6.2 R4: do not advertise 172.16.63.0/24 from area 2 into area 0
    6.3 R5: send NO LSAs to R8 (adjacency stays FULL). R8 reaches the rest of the network with a static default via R5

    ## 7  AUTHENTICATION WITH KEY CHAINS (configure BOTH ends)
    7.1 Area 0 links R1-R2, R2-R3, R3-R4, R4-R1: key chain KC-BACKBONE, key 1, HMAC-SHA-256, key-string BackboneKey256
    7.2 Area 1 links R2-R5, R5-R8: key chain KC-AREA1, key 7, HMAC-SHA-256, key-string Area1Key256
    7.3 Area 2 link R4-R6: key chain KC-AREA2, key 3, HMAC-SHA-256, key-string Area2Key256
    7.4 RIPv2 R3-R7: MD5 authentication using key chain KC-RIP, key 1, key-string RipKey1 (R7 needs configuring too)

    DONE WHEN: all neighbours are FULL, R6 pings 172.16.10.1 from Lo10, R8 pings 192.168.20.1 from Lo10, and every task verifies.

    ## Addressing (lower-numbered router = .1, higher = .2 on every /30)
    R1-R2 10.0.12.0 | R2-R3 10.0.23.0 | R3-R4 10.0.34.0 | R4-R1 10.0.14.0
    R2-R5 10.1.25.0 | R5-R8 10.1.58.0 | R4-R6 10.2.46.0 | R3-R7 10.9.37.0
    Router IDs / Lo0: Rn = n.n.n.n
    R1 Lo10 172.16.10.1/24 | R5 Lo10-13 172.16.48-51.1/24 | R6 Lo10-13 172.16.60-63.1/24
    R7 Lo10-13 192.168.10/20/30/40.1/24 | R8 Lo10 172.16.80.1/24
  version: 0.2.0
